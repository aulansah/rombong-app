name: Flutter CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to the version used locally, so CI reports exactly what
      # `flutter analyze` / `flutter test` report on the developer machine.
      # Flutter 3.47 deprecates package:flutter/material.dart in favour of
      # package:material_ui; bump this together with that migration.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
