name: rombong
description: Flutter client for rombong-api (Clean Architecture + Riverpod).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0" # Riverpod 3 + DropdownButtonFormField.initialValue

# Version ranges (not exact pins) so `flutter pub get` picks the newest
# release that is compatible with the Flutter SDK installed on your machine.
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  equatable: ">=2.0.7 <4.0.0"
  dio: ^5.8.0
  go_router: ">=14.8.0 <19.0.0"
  flutter_secure_storage: ">=9.2.2 <11.0.0"
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=4.0.0 <7.0.0"
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
